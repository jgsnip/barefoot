<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      padding: 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      color: #e0e0ff;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      height: 1.6rem;
      color: #a0c4ff;
      text-align: center;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, min(30vw, 110px));
      grid-template-rows: repeat(3, min(30vw, 110px));
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      font-size: clamp(2rem, 8vw, 3rem);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.04);
    }

    .cell.taken { cursor: default; }
    .cell.x { color: #ff6b9d; }
    .cell.o { color: #72efdd; }
    .cell.winner { background: #0f3460; border-color: #a0c4ff; }

    #restart {
      margin-top: 2rem;
      padding: 0.7rem 2.5rem;
      font-size: 1.1rem;
      background: #0f3460;
      color: #e0e0ff;
      border: 2px solid #a0c4ff;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #restart:hover, #restart:active { background: #1a4a8a; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status">Jij begint — klik een vakje</div>
  <div id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  <button id="restart">Opnieuw</button>

  <script>
    const LINES = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board = Array(9).fill("");
    let gameOver = false;

    const cells = document.querySelectorAll(".cell");
    const status = document.getElementById("status");

    function checkWinner(b) {
      for (const [a, c, d] of LINES) {
        if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a, c, d] };
      }
      return null;
    }

    function isFull(b) { return b.every(c => c !== ""); }

    function minimax(b, isMaximizing) {
      const result = checkWinner(b);
      if (result) return result.winner === "O" ? 1 : -1;
      if (isFull(b)) return 0;

      if (isMaximizing) {
        let best = -2;
        for (let i = 0; i < 9; i++) {
          if (b[i] === "") {
            b[i] = "O";
            best = Math.max(best, minimax(b, false));
            b[i] = "";
          }
        }
        return best;
      } else {
        let best = 2;
        for (let i = 0; i < 9; i++) {
          if (b[i] === "") {
            b[i] = "X";
            best = Math.min(best, minimax(b, true));
            b[i] = "";
          }
        }
        return best;
      }
    }

    function bestMove(b) {
      let bestScore = -2, move = -1;
      for (let i = 0; i < 9; i++) {
        if (b[i] === "") {
          b[i] = "O";
          const score = minimax(b, false);
          b[i] = "";
          if (score > bestScore) { bestScore = score; move = i; }
        }
      }
      return move;
    }

    function renderBoard() {
      board.forEach((val, i) => {
        cells[i].textContent = val === "X" ? "✕" : val === "O" ? "○" : "";
        cells[i].className = "cell" + (val ? " taken " + val.toLowerCase() : "");
      });
    }

    function highlight(line) {
      line.forEach(i => cells[i].classList.add("winner"));
    }

    cells.forEach(cell => {
      cell.addEventListener("click", () => {
        const i = parseInt(cell.dataset.index);
        if (gameOver || board[i] !== "") return;

        board[i] = "X";
        renderBoard();

        const afterPlayer = checkWinner(board);
        if (afterPlayer) {
          highlight(afterPlayer.line);
          status.textContent = "Gefeliciteerd, jij wint! 🎉";
          gameOver = true;
          return;
        }
        if (isFull(board)) {
          status.textContent = "Gelijkspel!";
          gameOver = true;
          return;
        }

        status.textContent = "Computer denkt…";
        setTimeout(() => {
          board[bestMove(board)] = "O";
          renderBoard();

          const afterComp = checkWinner(board);
          if (afterComp) {
            highlight(afterComp.line);
            status.textContent = "De computer wint. Probeer het opnieuw!";
            gameOver = true;
          } else if (isFull(board)) {
            status.textContent = "Gelijkspel!";
            gameOver = true;
          } else {
            status.textContent = "Jouw beurt";
          }
        }, 200);
      });
    });

    document.getElementById("restart").addEventListener("click", () => {
      board = Array(9).fill("");
      gameOver = false;
      renderBoard();
      status.textContent = "Jij begint — klik een vakje";
    });
  </script>
</body>
</html>
